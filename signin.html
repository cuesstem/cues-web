<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cues STEM</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandBg: "#0b0f19",
              brandBorder: "#1f2937",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-brandBg text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- NAVBAR (Do not edit this in other files once copy-pasted) -->
    <header class="border-b border-brandBorder bg-slate-950/80 px-6 py-4">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <a href="index.html" class="text-xl font-bold text-cyan-400">
          CUES<span class="text-slate-500 text-sm font-normal">.stem</span>
        </a>

        <nav
          class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300"
        >
          <a href="lessons.html" class="hover:text-white">Lessons</a>
          <a href="math.html" class="hover:text-amber-400">Math</a>
          <a href="physics.html" class="hover:text-cyan-400">Physics</a>
          <a href="chemistry.html" class="hover:text-emerald-400">Chemistry</a>
          <a href="it.html" class="hover:text-indigo-400">IT</a>
          <a href="study-guide.html" class="hover:text-white">Study Guide</a>
          <a href="for-teachers.html" class="hover:text-white">For Teachers</a>
          <a href="about.html" class="hover:text-white">About</a>
          <a
            href="signin.html"
            class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-1.5 rounded-md border border-slate-700"
            >Sign In</a
          >
        </nav>
      </div>
    </header>

    <main
      class="flex-1 max-w-md w-full mx-auto p-6 flex flex-col justify-center"
    >
      <div
        class="bg-slate-900/50 border border-brandBorder p-8 rounded-2xl space-y-6 shadow-xl backdrop-blur-sm"
      >
        <div class="text-center space-y-2">
          <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
          <p class="text-sm text-slate-400">
            Track lesson progress and save practice sets.
          </p>
        </div>

        <form class="space-y-5" onsubmit="event.preventDefault()">
          <div class="space-y-1.5">
            <label
              class="block text-xs font-semibold text-slate-400 uppercase tracking-wide"
              >Email</label
            >
            <input
              type="email"
              disabled
              placeholder="name@example.com"
              class="w-full bg-slate-950/50 border border-brandBorder rounded-lg px-4 py-2.5 text-sm text-slate-500 placeholder-slate-700 cursor-not-allowed focus:outline-none"
            />
          </div>

          <div class="space-y-1.5">
            <label
              class="block text-xs font-semibold text-slate-400 uppercase tracking-wide"
              >Password</label
            >
            <input
              type="password"
              disabled
              placeholder="••••••••"
              class="w-full bg-slate-950/50 border border-brandBorder rounded-lg px-4 py-2.5 text-sm text-slate-500 placeholder-slate-700 cursor-not-allowed focus:outline-none"
            />
          </div>

          <button
            disabled
            class="w-full bg-cyan-500/20 text-cyan-500/50 border border-cyan-500/20 font-bold py-3 rounded-lg text-sm cursor-not-allowed uppercase tracking-wide mt-2"
          >
            Sign In (Coming in v2.0)
          </button>
        </form>

        <p class="text-xs text-center text-slate-500 leading-relaxed">
          Platform is currently in Open-Access Mode. <br />
          All lessons and PDFs are available without an account.
        </p>
      </div>
    </main>

    <!-- FOOTER(TEXT KOJI STOJI DOLE)-->
    <footer
      class="border-t border-brandBorder px-6 py-6 text-center text-sm text-slate-500"
    >
      © 2026 Cues STEM. Open access educational platform.
    </footer>
  </body>
</html>
