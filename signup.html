<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Cues STEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandBg: "#0b0f19",
              brandBorder: "#1f2937",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-brandBg text-slate-100 min-h-screen flex flex-col font-sans">
    <div id="navbar-placeholder"></div>
    <main
      class="flex-1 max-w-md w-full mx-auto p-6 flex flex-col justify-center"
    >
      <div
        class="bg-slate-900/50 border border-brandBorder p-8 rounded-2xl space-y-6 shadow-xl backdrop-blur-sm"
      >
        <div class="text-center space-y-2">
          <h2 class="text-2xl font-bold text-white">Join CUES.stem</h2>
          <p class="text-sm text-slate-400">
            Create an account to track your STEM progress.
          </p>
        </div>

        <form
          class="space-y-5"
          id="signup-form"
          onsubmit="handleSignUpForm(event)"
        >
          <div class="space-y-1.5">
            <label
              class="block text-xs font-semibold text-slate-400 uppercase tracking-wide"
              >Username</label
            >
            <input
              type="text"
              id="username-input"
              required
              placeholder="stem_explorer"
              class="w-full bg-slate-950/50 border border-brandBorder rounded-lg px-4 py-2.5 text-sm text-slate-100 placeholder-slate-700 focus:outline-none focus:border-cyan-500"
            />
          </div>

          <div class="space-y-1.5">
            <label
              class="block text-xs font-semibold text-slate-400 uppercase tracking-wide"
              >Email</label
            >
            <input
              type="email"
              id="email-input"
              required
              placeholder="name@example.com"
              class="w-full bg-slate-950/50 border border-brandBorder rounded-lg px-4 py-2.5 text-sm text-slate-100 placeholder-slate-700 focus:outline-none focus:border-cyan-500"
            />
          </div>

          <div class="space-y-1.5">
            <label
              class="block text-xs font-semibold text-slate-400 uppercase tracking-wide"
              >Password</label
            >
            <input
              type="password"
              id="password-input"
              required
              placeholder="••••••••"
              class="w-full bg-slate-950/50 border border-brandBorder rounded-lg px-4 py-2.5 text-sm text-slate-100 placeholder-slate-700 focus:outline-none focus:border-cyan-500"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-lg text-sm uppercase tracking-wide transition-colors cursor-pointer mt-2 shadow-lg"
          >
            Create Account
          </button>
        </form>

        <div class="text-center pt-2 border-t border-brandBorder/50">
          <p class="text-sm text-slate-400">
            Already have an account?
            <a
              href="signin.html"
              class="text-cyan-400 hover:underline font-medium"
              >Sign in</a
            >
          </p>
        </div>
      </div>
    </main>

    <footer
      class="border-t border-brandBorder px-6 py-6 text-center text-sm text-slate-500"
    >
      &copy; 2026 Cues STEM. Open access educational platform.
    </footer>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script>
      async function handleSignUpForm(event) {
        event.preventDefault();

        const username = document.getElementById("username-input").value;
        const email = document.getElementById("email-input").value;
        const password = document.getElementById("password-input").value;

        await signUpUser(email, password, username);
      }
    </script>
  </body>
</html>
