<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cues STEM</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandBg: "#0b0f19",
              brandBorder: "#1f2937",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-brandBg text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- NAVBAR (Do not edit this in other files once copy-pasted) -->
    <header class="border-b border-brandBorder bg-slate-950/80 px-6 py-4">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <a href="index.html" class="text-xl font-bold text-cyan-400">
          CUES<span class="text-slate-500 text-sm font-normal">.stem</span>
        </a>

        <nav
          class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300"
        >
          <a href="lessons" class="hover:text-white">Lessons</a>
          <a href="math" class="hover:text-amber-400">Math</a>
          <a href="physics" class="hover:text-cyan-400">Physics</a>
          <a href="chemistry" class="hover:text-emerald-400">Chemistry</a>
          <a href="it" class="hover:text-indigo-400">IT</a>
          <a href="study-guide" class="hover:text-white">Study Guide</a>
          <a href="for-teachers" class="hover:text-white">For Teachers</a>
          <a href="about" class="hover:text-white">About</a>
          <a
            href="signin"
            class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-1.5 rounded-md border border-slate-700"
            >Sign In</a
          >
        </nav>
      </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-10 space-y-6">
      <div>
        <h1 class="text-4xl font-bold text-emerald-400">Physics Hub</h1>
        <p class="text-slate-400 mt-2 text-lg">
          Master physical models and Olympiad problem-solving.
        </p>
      </div>

      <!-- JavaScript will inject cards into this grid -->
      <div
        id="lesson-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </main>

    <!-- LOAD THE JS AT THE VERY BOTTOM, JUST ABOVE FOOTER -->
    <script src="lessons.js"></script>
    <script>
      renderLessons("chemistry"); // Change to 'math', 'chemistry', or 'it' on other pages
    </script>
    <!-- FOOTER(TEXT KOJI STOJI DOLE)-->
    <footer
      class="border-t border-brandBorder px-6 py-6 text-center text-sm text-slate-500"
