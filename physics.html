<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cues STEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandBg: "#0b0f19",
              brandBorder: "#1f2937",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-brandBg text-slate-100 min-h-screen flex flex-col font-sans">
    <div id="navbar-placeholder"></div>
    <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-10 space-y-6">
      <div>
        <h1 class="text-4xl font-bold text-cyan-400">Physics Hub</h1>
        <p class="text-slate-400 mt-2 text-lg">
          Master physical models and Olympiad problem-solving.
        </p>
      </div>

      <div
        id="lesson-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
      <div
        id="article-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
      <div
        id="video-modal"
        class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4"
      >
        <div
          class="relative w-full max-w-4xl bg-slate-900 border border-brandBorder rounded-2xl overflow-hidden shadow-2xl"
        >
          <button
            onclick="closeVideo()"
            class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold z-10 bg-slate-800/80 rounded-full w-8 h-8 flex items-center justify-center"
          >
            &times;
          </button>

          <div class="relative aspect-video w-full bg-black">
            <iframe
              id="video-frame"
              class="w-full h-full"
              src=""
              frameborder="0"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </div>
    </main>

    <footer
      class="border-t border-brandBorder px-6 py-6 text-center text-sm text-slate-500"
    >
      © 2026 Cues STEM. Open access educational platform.
    </footer>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        renderLessons("physics");
        renderArticles("physics");
      });
    </script>
  </body>
</html>
