<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cues STEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandBg: "#0b0f19",
              brandBorder: "#1f2937",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-brandBg text-slate-100 min-h-screen flex flex-col font-sans">
    <header
      class="border-b border-brandBorder bg-slate-950/90 backdrop-blur sticky top-0 z-50 px-4 md:px-6 py-4"
    >
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <a href="/cues-web/" class="text-xl font-bold text-cyan-400">
          CUES<span class="text-slate-500 text-sm font-normal">.stem</span>
        </a>

        <nav
          class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300"
        >
          <a href="lessons" class="hover:text-white transition-colors"
            >Lessons</a
          >
          <a href="math" class="hover:text-amber-400 transition-colors">Math</a>
          <a href="physics" class="hover:text-cyan-400 transition-colors"
            >Physics</a
          >
          <a href="chemistry" class="hover:text-emerald-400 transition-colors"
            >Chemistry</a
          >
          <a href="it" class="hover:text-indigo-400 transition-colors">IT</a>
          <a href="study-guide" class="hover:text-white transition-colors"
            >Study Guide</a
          >
          <a href="for-teachers" class="hover:text-white transition-colors"
            >For Teachers</a
          >
          <a href="about" class="hover:text-white transition-colors">About</a>
          <a
            href="signin"
            class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-1.5 rounded-md border border-slate-700 transition-all"
            >Sign In</a
          >
        </nav>

        <button
          id="menu-btn"
          onclick="toggleMobileMenu()"
          class="md:hidden text-slate-300 hover:text-white focus:outline-none p-1"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
      </div>

      <div
        id="mobile-menu"
        class="hidden md:hidden pt-4 pb-2 border-t border-brandBorder mt-4 space-y-3 text-sm font-medium text-slate-300"
      >
        <a href="lessons" class="block py-1 hover:text-white">Lessons</a>
        <a href="math" class="block py-1 hover:text-amber-400">Math</a>
        <a href="physics" class="block py-1 hover:text-cyan-400">Physics</a>
        <a href="chemistry" class="block py-1 hover:text-emerald-400"
          >Chemistry</a
        >
        <a href="it" class="block py-1 hover:text-indigo-400">IT</a>
        <a href="study-guide" class="block py-1 hover:text-white"
          >Study Guide</a
        >
        <a href="for-teachers" class="block py-1 hover:text-white"
          >For Teachers</a
        >
        <a href="about" class="block py-1 hover:text-white">About</a>
        <div class="pt-2">
          <a
            href="signin"
            class="block text-center bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-md border border-slate-700"
            >Sign In</a
          >
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-10 space-y-6">
      <div>
        <h1 class="text-4xl font-bold text-cyan-400">Physics Hub</h1>
        <p class="text-slate-400 mt-2 text-lg">
          Master physical models and Olympiad problem-solving.
        </p>
      </div>

      <div
        id="lesson-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
      <div
        id="article-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </main>

    <script src="lessons.js"></script>
    <script>
      renderLessons("physics");
    </script>

    <footer
      class="border-t border-brandBorder px-6 py-6 text-center text-sm text-slate-500"
    >
      © 2026 Cues STEM. Open access educational platform.
    </footer>
    <script src="main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        renderArticles("physics");
      });
    </script>
  </body>
</html>
